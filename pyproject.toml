[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dbmigrate"
version = "0.1.0"
description = "A safety-focused database migration and schema-evolution tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sarina Tari" }
]

[project.scripts]
dbmigrate = "dbmigrate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]